---- bi\u00ean d\u1ecbch ch\u01b0\u01a1ng tr\u00ecnh th\u00e0nh c\u00e1c \u0111o\u1ea1n th\u1eddi gian ----- */\nfunction compileDribble(nodes) {\n  const segs = []; let t = 0, guard = 0;\n  (function run(arr) {\n    for (const n of arr) {\n      if (guard++ > 80) return;\n      if (n.type === 'wait') { segs.push({ k: 'wait', id: n.id, s: t, d: n.p }); t += n.p; }\n      else if (n.type === 'left' || n.type === 'right') { segs.push({ k: n.type, id: n.id, s: t, d: DODGE_T }); t += DODGE_T; }\n      else if (n.type === 'loop') { for (let i = 0; i < n.p; i++) run(n.kids); }\n    }\n  })(nodes);\n  return { segs, total: t };\n}\nfunction compileShoot(nodes) {\n  const o = { power: 'v\u1eeba', aim: 'gi\u1eefa', height: 'th\u1ea5p', kick: false, steps: [] };\n  for (const n of nodes) {\n    o.steps.push(n.id);\n    if (n.type === 'power' || n.type === 'aim' || n.type === 'height') o[n.type] = n.p;\n    else if (n.type === 'kick') { o.kick = true; break; }\n  }\n  return o;\n}\n\n/* ----- timeline ----- */\nlet tlMax = 6;\nfunction renderTimeline() {\n  if (stageKey !== 'dribble' || !mission) { tlEl.hidden = true; $('tlnote').hidden = true; return; }\n  tlEl.hidden = false; $('tlnote').hidden = false;\n  tlMax = Math.max(5.5, Math.ceil(mission.tEnd + 0.5));\n  const pct = (t) => (t / tlMax * 100).toFixed(2) + '%';\n  let h = '';\n  for (let s = 0; s <= tlMax; s++) h += '<div class=\"tick\" style=\"left:' + pct(s) + '\"><i>' + s + 's<\/i><\/div>';\n  const hold = holdTime(), c = compileDribble(curProg());\n  let row = 0;\n  c.segs.forEach((g) => {\n    if (g.k === 'wait') return;\n    const cls = g.k === 'left' ? 'dl' : 'dr';\n    const w = Math.min(hold, tlMax - g.s);\n    h += '<div class=\"bar ' + cls + '\" style=\"left:' + pct(g.s) + ';width:' + pct(Math.max(0.2, w)) + ';bottom:' + (row++ % 2 ? 20 : 4) + 'px\" title=\"' + (g.k === 'left' ? 'N\u00e9 tr\u00e1i' : 'N\u00e9 ph\u1ea3i') + '\"><\/div>';\n  });\n  mission.events.forEach((ev) => { h += '<div class=\"def ' + (ev.side === 'R' ? 'r' : '') + '\" style=\"left:' + pct(ev.T) + '\" title=\"H\u1eadu v\u1ec7 lao v\u00e0o t\u1eeb b\u00ean ' + SIDE_VN[ev.side] + '\">' + (ev.side === 'L' ? 'T' : 'P') + '<\/div>'; });\n  h += '<div class=\"head\" id=\"head\"><\/div>';\n  tlEl.innerHTML = h;\n}\nfunction setHead(t) { const el = $('head'); if (!el) return; el.style.display = t < 0 ? 'none' : 'block'; el.style.left = (t / tlMax * 100) + '%'; }\n\nfunction setActive(id) {\n  activeId = id;\n  document.querySelectorAll('#prog .blk.active').forEach((e) => e.classList.remove('active'));\n  if (id != null) { const el = progEl.querySelector('.blk[data-id=\"' + id + '\"]'); if (el) el.classList.add('active'); }\n}\nfunction markBad(ids) { ids.forEach((id) => { const el = progEl.querySelector('.blk[data-id=\"' + id + '\"]'); if (el) el.classList.add('bad'); }); }\nfunction setLocked(v) { locked = v; $('prog').classList.toggle('progrun', v); $('run').disabled = v; $('clear').disabled = v; }\n$('clear').addEventListener('click', () => { if (locked) return; curProg().length = 0; renderProg(); renderTimeline(); onProgChange(); });\n\n/* ---------------- Flight step ---------------- */\nfunction setResult(r, extra) {\n  if (shot.result === 'goal') return;\n  shot.result = r; shot.resultAt = shot.t; shot.bannerDone = false;\n  shot.extra = extra || {};\n  shot.prov = (r === 'wall' || r === 'save');\n}\nfunction evalCrossing(px, py, pz) {\n  const f = pz / (pz - ball.pos.z);\n  const cx = px + (ball.pos.x - px) * f, cy = py + (ball.pos.y - py) * f;\n  const hw = GOAL_W / 2, r = BR * 0.6;\n  shot.crossed = true;\n  if (Math.abs(cx) < hw - r && cy < GOAL_H - r) { setResult('goal', { x: cx, y: cy }); sfxGoalPending = true; return; }\n  if (shot.result && shot.result !== 'goal') return;\n  if (Math.abs(cx) < hw + POST + r && cy < GOAL_H + POST + r) {\n    const bar = cy >= GOAL_H - r;\n    setResult(bar ? 'bar' : 'post');\n    ball.vel.z = Math.abs(ball.vel.z) * 0.45; ball.vel.x *= 0.6; ball.vel.y = bar ? - n = (s) => (s === 'L' ? -1 : 1);\nfunction keeperBox() {\n  const e = keeper.ease, tb = keeper.tilt, lift = keeperObj.position.y;\n  return { cx: keeper.x + keeper.dir * 0.45 * tb * e, cy: 0.95 + lift - (keeper.gy < 0.9 ? 0.35 * e : 0), a: 0.62 + 0.75 * e, b: 0.95 + 0.12 * e };\n}\nfunction resetKeeper() {\n  keeper.x = 0; keeper.diving = false; keeper.diveT = 0; keeper.ease = 0; keeper.dir = 0; keeper.tilt = 0;\n  keeper.react = Math.max(0.15, 0.35 - 0.015 * mission.L);\n  keeper.speed = Math.min(14, 6 + 0.8 * mission.L);\n  keeperObj.position.set(0, 0, KEEPER_Z); keeperObj.rotation.set(0, 0, 0);\n}\nfunction updateKeeper(dt) {\n  const u = keeperObj.userData, K = mission.keeper;\n  if (!shot || !shot.launched) {\n    const lean = K.mode === 'dive' ? sgn(K.side) * 0.45 : 0;\n    keeper.x += (lean + Math.sin(time * 1.6) * 0.12 - keeper.x) * Math.min(1, dt * 3);\n    keeperObj.position.set(keeper.x, 0, KEEPER_Z);\n    u.armL.rotation.set(0, 0, 0.8); u.armR.rotation.set(0, 0, -0.8);\n    u.legL.rotation.z = 0.12; u.legR.rotation.z = -0.12;\n    return;\n  }\n  if (!keeper.diving && shot.t >= keeper.react) {\n    keeper.diving = true; keeper.diveT = 0;\n    if (K.mode === 'dive') {\n      keeper.gx = sgn(K.side) * 2.7;\n      keeper.gy = K.h === 'th\u1ea5p' ? 0.6 : (K.h === 'cao' ? 1.9 : 1.0);\n    } else { keeper.gx = keeper.x; keeper.gy = 1.0; }\n    keeper.dir = Math.abs(keeper.gx - keeper.x) < 0.5 ? 0 : Math.sign(keeper.gx - keeper.x);\n    keeper.tilt = MU.clamp(Math.abs(keeper.gx) / 2.6, 0, 1);\n  }\n  if (keeper.diving) {\n    keeper.diveT += dt;\n    const dx = keeper.gx - keeper.x, step = keeper.speed * dt;\n    if (Math.abs(dx) <= step) keeper.x = keeper.gx; else keeper.x += Math.sign(dx) * step;\n    keeper.ease = Math.min(1, keeper.diveT / 0.4);\n  }\n  const e = keeper.ease;\n  keeperObj.position.set(keeper.x, MU.clamp(keeper.gy - 1.0, 0, 1.2) * e * (0.6 + 0.4 * keeper.tilt), KEEPER_Z);\n  keeperObj.rotation.z = -keeper.dir * 0.95 * keeper.tilt * e;\n  u.armL.rotation.z = MU.lerp(0.8, 2.7, e); u.armR.rotation.z = MU.lerp(-0.8, -2.7, e);\n  u.legL.rotation.z = 0.12 + e * 0.4; u.legR.rotation.z = -0.12 - e * 0.4;\n}\nfunction updateWall() { /* h\u00e0ng r\u00e0o \u0111\u01b0\u1ee3c d\u00f9ng l\u00e0m h\u1eadu v\u1ec7, x\u1eed l\u00fd trong c\u1ea3nh qua ng\u01b0\u1eddi */ }\n\n/* ----- D\u00e1ng ch\u1ea1y ----- */\nfunction poseRun(p, t, amt) {\n  const u = p.userData, sw = Math.sin(t * 17) * 0.75 * amt;\n  u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw * 0.7; u.armR.rotation.x = sw * 0.7;\n  p.position.y = Math.abs(Math.sin(t * 17)) * 0.05 * amt;\n}\nfunction poseKicker(t) {\n  const u = kicker.userData;\n  let legR = 0, legL = 0, arm = 0, bounce = 0;\n  if (t < 0.55) {\n    const q = t / 0.55, e = 1 - (1 - q) * (1 - q);\n    kicker.position.lerpVectors(shot.kS, shot.kK, e);\n    const sw = Math.sin(t * 17) * 0.75;\n    legL = sw; legR = -sw; arm = sw * 0.7; bounce = Math.abs(Math.sin(t * 17)) * 0.05;\n  } else {\n    kicker.position.copy(shot.kK);\n    if (t < 0.64) { const q = (t - 0.55) / 0.09; legR = MU.lerp(-0.2, 0.95, q); legL = 0.1 * q; arm = -0.6 * q; }\n    else if (t < 0.78) { const q = (t - 0.64) / 0.14; legR = MU.lerp(0.95, -1.35, q * q); legL = 0.1; arm = -0.6; }\n    else if (t < 1.1) { legR = -1.2; legL = 0.1; arm = -0.4; }\n    else { const q = Math.min(1, (t - 1.1) / 0.4); legR = MU.lerp(-1.2, 0, q); legL = MU.lerp(0.1, 0, q); arm = MU.lerp(-0.4, 0, q); }\n  }\n  kicker.position.y = bounce;\n  u.legL.rotation.x = legL; u.legR.rotation.x = legR; u.armL.rotation.x = -arm; u.armR.rotation.x = arm;\n}\n\n/* ----- C\u1ea3nh qua ng\u01b0\u1eddi ----- */\nlet shot = null, time = 0, kickT = 0, acc = 0, trauma = 0, timer = 0;\nconst run = { t: 0, segs: [], done: [], fail: null, stopT: -1, ballZ: 0 };\n\nfunction resetDribbleScene() {\n  px3.x = 0; px3.z = RUN_Z0;\n  kicker.position.set(0, 0, RUN_Z0); kicker.rotation.set(0, Math.PI, 0);\n  poseRun(kicker, 0, 0);\n  ball.pos.set(0, BR, RUN_Z0 - 0.8); ball.vel.set(0, 0, 0); ballMesh.position.copy(ball.pos); ballMesh.quaternion.identity();\n  wallPlayers.forEach((w, i) => {\n    const ev = mission.events[i];\n    w.obj.visible = !!ev;\n    if (!ev) return;\n    w.x0 = sgn(ev.side) * 1.6; w.z = RUN_Z0 - RUN_V * ev.T - 0.15;\n    w.obj.position.set(w.x0, 0, w.z); w.obj.rotation.set(0, -sgn(ev.side) * Math.PI / 2, 0);\n    const u = w.obj.userData; u.armL.rotation.set(-0.5, 0, -0.6); u.armR.rotation.set(-0.5, 0, 0.6); u.legL.rotation.x = 0; u.legR.rotation.x = 0;\n  });\n  resetKeeper();\n  shot = null;\n  keeperObj.visible = true;\n  bannerEl.hidden = true;\n}\n\nfunction startDribble() {\n  const c = compileDribble(progs.dribble);\n  run.t = 0; run.segs = c.segs; run.done = mission.events.map(() => false); run.fail = null; run.stopT = -1; run.ballZ0 = 0;\n  resetDribbleScene();\n  document.querySelectorAll('#prog .blk.bad').forEach((e) => e.classList.remove('bad'));\n  setLocked(true); phase = 'dribbleRun'; sfx.whistle();\n  reticle.visible = false; preview.visible = false;\n}\n\nfunction explainFail(ev, segs) {\n  const need = ev.side === 'L' ? 'right' : 'left', needVn = need === 'right' ? 'PH\u1ea2I' : 'TR\u00c1I', wrong = need === 'right' ? 'left' : 'right';\n  const dodges = segs.filter((g) => g.k !== 'wait');\n  const good = dodges.filter((g) => g.k === need).sort((a, b) => Math.abs(a.s - (ev.T - 0.5)) - Math.abs(b.s - (ev.T - 0.5)))[0];\n  const bad = dodges.filter((g) => g.k === wrong && g.s > ev.T - 1.6 && g.s < ev.T + 0.1)[0];\n  if (good && Math.abs(good.s - (ev.T - 0.5)) <= 1.6) {\n    const d = (ev.T - 0.5) - good.s;\n    if (d > 0.2) return { ids: [good.id], text: 'N\u00e9 s\u1edbm qu\u00e1. B\u1ea1n n\u00e9 xong tr\u01b0\u1edbc khi h\u1eadu v\u1ec7 t\u1edbi, h\u00e3y ch\u1edd th\u00eam kho\u1ea3ng ' + fmtNum(Math.round(d * 2) / 2) + ' gi\u00e2y.' };\n    if (d < -0.2) return { ids: [good.id], text: 'N\u00e9 mu\u1ed9n qu\u00e1. H\u1eadu v\u1ec7 \u0111\u00e3 t\u1edbi tr\u01b0\u1edbc khi b\u1ea1n n\u00e9, h\u00e3y ch\u1edd \u00edt h\u01a1n kho\u1ea3ng ' + fmtNum(Math.round(-d * 2) / 2) + ' gi\u00e2y.' };\n  }\n  if (bad) return { ids: [bad.id], text: 'N\u00e9 nh\u1ea7m b\u00ean. H\u1eadu v\u1ec7 lao t\u1eeb b\u00ean ' + SIDE_VN[ev.side] + ' n\u00ean b\u1ea1n ph\u1ea3i n\u00e9 sang ' + needVn + '.' };\n  return { ids: [], text: 'Ch\u01b0a c\u00f3 kh\u1ed1i n\u00e9 \u0111\u00fang l\u00fac. H\u1eadu v\u1ec7 lao t\u1eeb b\u00ean ' + SIDE_VN[ev.side] + ' sau ' + fmtNum(ev.T) + ' gi\u00e2y, h\u00e3y n\u00e9 sang ' + needVn + '.' };\n}\n\nfunction updateDribble(dt) {\n  const hold = holdTime();\n  run.t += dt;\n  const t = run.t;\n  // \u0111ang b\u1ecb ng\u00e3\n  if (run.fail) {\n    const q = Math.min(1, (t - run.fail.t0) / 0.45);\n    kicker.rotation.x = 1.45 * q; kicker.position.y = 0.05;\n    poseRun(kicker, 0, 0);\n    ball.pos.z -= Math.max(0, 3.2 * (1 - q)) * dt;\n    ballMesh.position.copy(ball.pos);\n    if (t - run.fail.t0 > 0.5 && phase === 'dribbleRun') {\n      phase = 'dribbleFail'; timer = 3.0;\n      mission.tries++;\n      showBanner('miss', 'B\u1ecb c\u01b0\u1edbp b\u00f3ng!', run.fail.text);\n      markBad(run.fail.ids); setHead(-1);\n      sfx.miss();\n    }\n    updateDefenders(t);\n    return;\n  }\n  const stopped = run.stopT >= 0;\n  if (!stopped) {\n    let tx = 0, best = -1;\n    run.segs.forEach((g) => {\n      if (g.k === 'wait') return;\n      if (t >= g.s + 0.15 && t <= g.s + hold && g.s > best) { best = g.s; tx = g.k === 'left' ? -DODGE_X : DODGE_X; }\n    });\n    px3.x += (tx - px3.x) * (1 - Math.exp(-dt * 9));\n    px3.z = RUN_Z0 - RUN_V * t;\n    kicker.position.set(px3.x, 0, px3.z);\n    kicker.rotation.y = Math.PI + (tx - px3.x) * -0.08;\n    poseRun(kicker, t, 1);\n    ball.pos.set(px3.x * 0.97, BR, px3.z - 0.78 - 0.12 * Math.sin(t * 8.5));\n    ballMesh.position.copy(ball.pos);\n    ballMesh.rotation.x -= RUN_V * dt / BR;\n    // \u0111ang ch\u1ea1y d\u00f2ng l\u1ec7nh n\u00e0o\n    let cur = null; run.segs.forEach((g) => { if (t >= g.s && t < g.s + g.d) cur = g.id; });\n    setActive(cur); setHead(t);\n    // va ch\u1ea1m v\u1edbi t\u1eebng h\u1eadu v\u1ec7\n    mission.events.forEach((ev, i) => {\n      if (run.done[i] || t < ev.T) return;\n      run.done[i] = true;\n      if (sgn(ev.side) * -px3.x >= 1.0) { flash('Qua ng\u01b0\u1eddi!', 'goal', 900); sfx.tone(660, 0.12, 'square', 0.05); sfx.tone(880, 0.16, 'square', 0.05, 0.1); }\n      else { const ex = explainFail(ev, run.segs); run.fail = { t0: t, text: ex.text, ids: ex.ids }; sfx.save(); trauma = 0.6; }\n    });\n    if (!run.fail && t >= mission.tEnd) run.stopT = t;\n  } else {\n    poseRun(kicker, 0, 0);\n    px3.x += (0 - px3.x) * (1 - Math.exp(-dt * 9)); kicker.position.x = px3.x;\n    // b\u00f3ng l\u0103n th\u00eam m\u1ed9t \u0111o\u1ea1n r\u1ed3i d\u1eebng\n    const q = Math.min(1, (t - run.stopT) / 0.9);\n    ball.pos.z = run.ballZ0 - 2.0 * (1 - (1 - q) * (1 - q));\n    ball.pos.x = px3.x * 0.97;\n    ballMesh.position.copy(ball.pos);\n    ballMesh.rotation.x -= (1 - q) * 8 * dt;\n    if (q >= 1) { beginShootStage(); return; }\n  }\n  if (run.stopT >= 0 && !run.ballZ0) run.ballZ0 = ball.pos.z;\n  updateDefenders(t);\n}\nfunction updateDefenders(t) {\n  mission.events.forEach((ev, i) => {\n    const w = wallPlayers[i], s = sgn(ev.side), u = w.obj.userData;\n    const q = MU.clamp((t - (ev.T - 0.45)) / 0.45, 0, 1), e = 1 - (1 - q) * (1 - q);\n    w.obj.position.x = MU.lerp(w.x0, s * 0.15, e);\n    w.obj.rotation.x = -1.25 * e;\n    w.obj.position.y = 0.1 * e;\n    u.legL.rotation.x = 0.4 * e; u.legR.rotation.x = 0.4 * e;\n  });\n}\n\n/* ================= Giai \u0111o\u1ea1n s\u00fat ================= */\nlet shotSpot = null;\nfunction makeShot() {\n  const b = shotSpot;\n  shot = {\n    b0: b.clone(), f: new V3(0, 0, -1), t: 0, launched: false, result: null, resultAt: 0, prov: false, bannerDone: false,\n    crossed: false, saved: false, deflected: false, extra: {}, spin: 0, power: 0, launchVel: null, cross: null,\n    kS: kicker.position.clone(), kK: b.clone().add(new V3(-0.34, 0, 0.62))\n  };\n  shot.kK.y = 0;\n}\nfunction beginShootStage() {\n  shotSpot = ball.pos.clone(); shotSpot.y = BR;\n  ball.vel.set(0, 0, 0);\n  wallPlayers.forEach((w) => { w.obj.visible = false; });\n  makeShot();\n  resetKeeper();\n  enterEdit('shoot');\n  flash('Qua ng\u01b0\u1eddi th\u00e0nh c\u00f4ng! Gi\u1edd h\u00e3y l\u1eadp tr\u00ecnh c\u00fa s\u00fat.', 'goal', 2200);\n}\nfunction resetShoot() {\n  ball.pos.copy(shotSpot); ball.vel.set(0, 0, 0); ballMesh.position.copy(ball.pos); ballMesh.quaternion.identity();\n  kicker.position.copy(shot.kS); kicker.rotation.set(0, Math.PI, 0); poseRun(kicker, 0, 0);\n  const keep = shot.kS.clone(); makeShot(); shot.kS.copy(keep);\n  resetKeeper();\n  bannerEl.hidden = true;\n  enterEdit('shoot');\n}\nfunction shootParams() {\n  const o = compileShoot(progs.shoot), p = POWER_P[o.power];\n  return { o, p, speed: (17 + 19 * p) * (1 + 0.05 * eff('power')), tgt: { x: AIM_X[o.aim], y: HEIGHT_Y[o.height] } };\n}\nfunction updateShootPreview() {\n  if (phase !== 'edit' || stageKey !== 'shoot') return;\n  const sp = shootParams(), pts = [];\n  const v = solveVelocity(ball.pos, sp.tgt, sp.speed, 0);\n  simulate(ball.pos, v, 0, pts);\n  preview.count = pts.length;\n  for (let i = 0; i < pts.length; i++) {\n    const s = 0.1 + 0.07 * (1 - i / Math.max(1, pts.length));\n    _d.position.copy(pts[i]); _d.scale.set(s, s, s); _d.updateMatrix(); preview.setMatrixAt(i, _d.matrix);\n  }\n  preview.instanceMatrix.needsUpdate = true;\n  reticle.position.set(sp.tgt.x, sp.tgt.y, 0.1);\n  reticle.visible = true; preview.visible = true;\n}\nonProgChange = () => { if (phase === 'edit' && stageKey === 'shoot') updateShootPreview(); };\n\nfunction startShootRun() {\n  const o = compileShoot(progs.shoot);\n  if (!o.kick) { flash('Ch\u01b0\u01a1ng tr\u00ecnh c\u1ea7n kh\u1ed1i S\u00fat! \u1edf cu\u1ed1i \u0111\u1ec3 c\u1ea7u th\u1ee7 s\u00fat.', 'miss', 2400); return; }\n  setLocked(true); phase = 'shootRun'; run.t = 0; run.i = -1; run.o = o;\n}\nfunction fire(o) {\n  const p = POWER_P[o.power], tgt = { x: AIM_X[o.aim], y: HEIGHT_Y[o.height] };\n  const v = solveVelocity(ball.pos, tgt, (17 + 19 * p) * (1 + 0.05 * eff('power')), 0);\n  const R = seeded(mission.seed + 3), spread = POWER_SPREAD[o.power] * (1 - 0.28 * eff('control'));\n  if (spread > 0) {\n    v.applyAxisAngle(new V3(0, 1, 0), (R() * 2 - 1) * spread);\n    const axis = new V3(v.x, 0, v.z).cross(new V3(0, 1, 0)).normalize();\n    v.applyAxisAngle(axis, (R() * 0.9 - 0.1) * spread);\n  }\n  shot.launchVel = v; shot.power = p; shot.spin = 0; shot.cross = simulate(ball.pos, v, 0);\n  kickT = 0; phase = 'kick'; setActive(null); sfx.whistle();\n}\nfunction launch() {\n  ball.vel.copy(shot.launchVel); ball.spin = 0;\n  shot.launched = true; shot.t = 0; acc = 0; sfx.kick(); phase = 'fly';\n}\n\n/* ================= K\u1ebft qu\u1ea3 ================= */\nconst MISS = {\n  post: ['C\u1ed9t d\u1ecdc!', 'S\u00e1t l\u1eafm r\u1ed3i, th\u1eed l\u1ea1i nh\u00e9.'], bar: ['X\u00e0 ngang!', 'Ch\u1ec9 thi\u1ebfu v\u00e0i ph\u00e2n th\u00f4i.'],\n  save: ['Th\u1ee7 m\u00f4n c\u1ea3n ph\u00e1!', 'H\u00e3y s\u00fat v\u00e0o ph\u00eda m\u00e0 th\u1ee7 m\u00f4n kh\u00f4ng bay t\u1edbi, ho\u1eb7c s\u00fat m\u1ea1nh h\u01a1n.'],\n  wall: ['B\u1ecb ch\u1eb7n!', 'Th\u1eed l\u1ea1i v\u1edbi h\u01b0\u1edbng kh\u00e1c.'],\n  over: ['Bay qu\u00e1 x\u00e0!', 'Th\u1eed \u0111\u1ed9 cao th\u1ea5p ho\u1eb7c l\u1ef1c nh\u1eb9 h\u01a1n.'], wide: ['Ra ngo\u00e0i!', 'Th\u1eed l\u1ea1i v\u1edbi h\u01b0\u1edbng kh\u00e1c.']\n};\nfunction resolveShot() {\n  const r = shot.result;\n  if (r === 'goal') {\n    shot.won = true; sfx.goal(); burst(140); crowd.cheer = 1; trauma = Math.max(trauma, 0.7);\n    showBanner('goal', 'V\u00c0OOO!', ''); timer = 1.8;\n  } else {\n    shot.won = false; mission.tries++; sfx.miss();\n    const t = MISS[r] || ['Tr\u01b0\u1ee3t r\u1ed3i!', ''];\n    showBanner(r === 'save' ? 'save' : 'miss', t[0], t[1]); timer = 2.8;\n  }\n  phase = 'result';\n}\nfunction giveReward() {\n  const e = shot.extra, lines = [];\n  let coins = mission.base;\n  lines.push(['Ghi b\u00e0n', mission.base]);\n  if (mission.tries === 0) { const b = Math.round(mission.base * 0.4); coins += b; lines.push(['L\u00e0m \u0111\u00fang ngay l\u1ea7n \u0111\u1ea7u', b]); }\n  const used = countNodes(progs.dribble);\n  if (used <= mission.par) { coins += 25; lines.push(['Code g\u1ecdn, d\u00f9ng ' + used + '/' + mission.par + ' kh\u1ed1i', 25]); }\n  if (!shot.deflected && Math.abs(e.x) > 2.7 && e.y > 1.5) { coins += 20; lines.push(['G\u00f3c ch\u1ebft', 20]); }\n  const mul = curClub().coinMul;\n  if (mul > 1) { const b = Math.round(coins * (mul - 1)); coins += b; lines.push([curClub().name + ' \u00d7' + fmtNum(mul), b]); }\n  save.coins += coins; save.level++; persist(); updateHUD();\n  return { coins, lines };\n}\n\n/* ================= M\u00e0n h\u00ecnh gi\u1eefa s\u00e2n ================= */\nlet lastScreen = null;\nfunction show(html) { ov.hidden = false; ov.innerHTML = '<div class=\"card\">' + html + '<\/div>'; const b = ov.querySelector('[data-act]'); if (b) { try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } }\nfunction hideOverlay() { ov.hidden = true; ov.innerHTML = ''; }\nconst WM = '<div class=\"wm\" aria-label=\"logiscool\"><span class=\"w1\">logi<\/span><span class=\"w2\">s<\/span><span class=\"w3\">cool<\/span><\/div>';\nfunction toMenuState() { phase = 'menu'; setLocked(true); stageKey = 'dribble'; }\nfunction showMenu() {\n  lastScreen = showMenu; toMenuState();\n  mission = makeMission(save.level); mission.tries = 0;\n  resetDribbleScene(); updateHUD();\n  show(WM + '<h1>Code Football<\/h1>' +\n    '<p>Vi\u1ebft ch\u01b0\u01a1ng tr\u00ecnh \u0111\u1ec3 c\u1ea7u th\u1ee7 qua ng\u01b0\u1eddi, r\u1ed3i s\u00fat v\u00e0o g\u00f3c khung th\u00e0nh. Ghi b\u00e0n \u0111\u1ec3 ki\u1ebfm xu, n\u00e2ng c\u1ea5p c\u1ea7u th\u1ee7 v\u00e0 gia nh\u1eadp c\u00e2u l\u1ea1c b\u1ed9 m\u1edbi.<\/p>' +\n    '<ol><li>K\u00e9o ho\u1eb7c ch\u1ea1m c\u00e1c kh\u1ed1i l\u1ec7nh v\u00e0o \u00f4 Ch\u01b0\u01a1ng tr\u00ecnh c\u1ee7a b\u1ea1n.<\/li><li>Qua ng\u01b0\u1eddi: d\u00f9ng Ch\u1edd v\u00e0 N\u00e9 \u0111\u1ec3 n\u00e9 \u0111\u00fang l\u00fac h\u1eadu v\u1ec7 lao v\u00e0o.<\/li><li>S\u00fat: ch\u1ecdn l\u1ef1c, h\u01b0\u1edbng, \u0111\u1ed9 cao r\u1ed3i k\u1ebft th\u00fac b\u1eb1ng kh\u1ed1i S\u00fat!<\/li><\/ol>' +\n    '<div class=\"cardrow\"><button class=\"chunk\" type=\"button\" data-act=\"start\">Nhi\u1ec7m v\u1ee5 ' + save.level + '<\/button><button class=\"chunk alt\" type=\"button\" data-act=\"shop\">C\u1eeda h\u00e0ng v\u00e0 CLB<\/button><\/div>');\n}\nfunction showReward(r) {\n  lastScreen = () => showReward(r); toMenuState(); phase = 'reward';\n  show('<h1>Nhi\u1ec7m v\u1ee5 ' + (save.level - 1) + ' ho\u00e0n th\u00e0nh!<\/h1><ul>' + r.lines.map((l) => '<li>' + l[0] + ': <b>+' + l[1] + ' xu<\/b><\/li>').join('') + '<\/ul>' +\n    '<div class=\"chips\"><div class=\"chip\"><small>Nh\u1eadn \u0111\u01b0\u1ee3c<\/small>+' + r.coins + ' xu<\/div><div class=\"chip\"><small>T\u1ed5ng xu<\/small>' + save.coins + '<\/div><\/div>' +\n    '<p>D\u00f9ng xu \u0111\u1ec3 n\u00e2ng c\u1ea5p c\u1ea7u th\u1ee7 ho\u1eb7c gia nh\u1eadp c\u00e2u l\u1ea1c b\u1ed9 kh\u00e1c.<\/p>' +\n    '<div class=\"cardrow\"><button class=\"chunk\" type=\"button\" data-act=\"start\">Nhi\u1ec7m v\u1ee5 ' + save.level + '<\/button><button class=\"chunk alt\" type=\"button\" data-act=\"shop\">C\u1eeda h\u00e0ng v\u00e0 CLB<\/button><\/div>');\n}\nlet shopTab = 'up';\nfunction showShop() {\n  let h = '<h1>C\u1eeda h\u00e0ng v\u00e0 CLB<\/h1><div class=\"chips\"><div class=\"chip\"><small>Xu<\/small>' + save.coins + '<\/div><div class=\"chip\"><small>C\u1ea5p<\/small>' + save.level + '<\/div><\/div>' +\n    '<div class=\"cardrow\"><button class=\"chunk alt\" type=\"button\" data-act=\"tab:up\" aria-pressed=\"' + (shopTab === 'up') + '\">N\u00e2ng c\u1ea5p<\/button><button class=\"chunk alt\" type=\"button\" data-act=\"tab:club\" aria-pressed=\"' + (shopTab === 'club') + '\">C\u00e2u l\u1ea1c b\u1ed9<\/button><\/div><div class=\"shoplist\">';\n  if (shopTab === 'up') {\n    Object.keys(UPGRADES).forEach((k) => {\n      const u = UPGRADES[k], n = save.up[k], bonus = (curClub().perks && curClub().perks[k]) || 0, max = n >= u.max, cost = u.cost[n];\n      let pips = ''; for (let i = 0; i < u.max; i++) pips += '<i class=\"' + (i < n ? 'on' : '') + '\"><\/i>';\n      h += '<div class=\"item\"><h3>' + u.name + (bonus ? ' <small>(+' + bonus + ' t\u1eeb CLB)<\/small>' : '') + '<\/h3><div class=\"pips\">' + pips + '<\/div><p>' + u.desc(n + bonus) + '<\/p>' +\n        '<button class=\"buy\" type=\"button\" data-act=\"buy:' + k + '\"' + (max || save.coins < cost ? ' disabled' : '') + '>' + (max ? 'T\u1ed1i \u0111a' : 'Mua \u00b7 ' + cost + ' xu') + '<\/button><\/div>';\n    });\n  } else {\n    CLUBS.forEach((c) => {\n      const owned = save.owned.includes(c.id), cur = save.club === c.id;\n      let btn;\n      if (cur) btn = '<button class=\"buy\" type=\"button\" disabled>\u0110ang m\u1eb7c<\/button>';\n      else if (owned) btn = '<button class=\"buy\" type=\"button\" data-act=\"wear:' + c.id + '\">M\u1eb7c \u00e1o<\/button>';\n      else if (save.level < c.need) btn = '<button class=\"buy\" type=\"button\" disabled>C\u1ea7n c\u1ea5p ' + c.need + '<\/button>';\n      else btn = '<button class=\"buy\" type=\"button\" data-act=\"join:' + c.id + '\"' + (save.coins < c.fee ? ' disabled' : '') + '>Gia nh\u1eadp \u00b7 ' + c.fee + ' xu<\/button>';\n      const hex = (n) => '#' + n.toString(16).padStart(6, '0');\n      h += '<div class=\"item club' + (cur ? ' cur' : '') + '\"><div class=\"nm\"><span class=\"kit\"><i style=\"background:' + hex(c.kit.shirt) + '\"><\/i><i style=\"background:' + hex(c.kit.shorts) + '\"><\/i><i style=\"background:' + hex(c.kit.boots) + '\"><\/i><\/span><h3>' + c.name + '<\/h3><\/div><p>' + c.perk + '<\/p>' + btn + '<\/div>';\n    });\n  }\n  show(h + '<\/div><button class=\"chunk\" type=\"button\" data-act=\"close\">\u0110\u00f3ng<\/button>');\n}\nfunction closeShop() {\n  if (lastScreen && (phase === 'menu' || phase === 'reward')) lastScreen();\n  else { hideOverlay(); if (phase === 'edit') enterEdit(stageKey); }\n}\nfunction placeKicker() {\n  if (stageKey === 'shoot' && shot) { kicker.position.copy(shot.kS); } else kicker.position.set(px3.x, 0, px3.z);\n  kicker.rotation.set(0, Math.PI, 0);\n}\nov.addEventListener('click', (e) => {\n  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;\n  sfx.ensure();\n  const [a, arg] = b.dataset.act.split(':');\n  if (a === 'start') { hideOverlay(); startMission(); }\n  else if (a === 'shop') { shopTab = 'up'; showShop(); }\n  else if (a === 'close') closeShop();\n  else if (a === 'tab') { shopTab = arg; showShop(); }\n  else if (a === 'buy') { const u = UPGRADES[arg], n = save.up[arg]; if (n < u.max && save.coins >= u.cost[n]) { save.coins -= u.cost[n]; save.up[arg]++; persist(); updateHUD(); sfx.goal(); showShop(); } }\n  else if (a === 'join') { const c = clubOf(arg); if (!save.owned.includes(arg) && save.level >= c.need && save.coins >= c.fee) { save.coins -= c.fee; save.owned.push(arg); save.club = arg; persist(); updateHUD(); buildKicker(); placeKicker(); sfx.goal(); showShop(); } }\n  else if (a === 'wear') { if (save.owned.includes(arg)) { save.club = arg; persist(); updateHUD(); buildKicker(); placeKicker(); showShop(); } }\n});\n$('clubBtn').addEventListener('click', () => { if (phase === 'edit' || phase === 'menu' || phase === 'reward') { shopTab = 'club'; showShop(); } });\n\n/* ================= Nhi\u1ec7m v\u1ee5 & giao di\u1ec7n l\u1eadp tr\u00ecnh ================= */\nfunction startMission() {\n  mission = makeMission(save.level); mission.tries = 0;\n  progs.dribble.length = 0; progs.shoot.length = 0; stageKey = 'dribble';\n  resetDribbleScene(); enterEdit('dribble');\n}\nfunction setBrief() {\n  const el = $('brief');\n  if (stageKey === 'dribble') {\n    const parts = mission.events.map((ev, i) => 'H\u1eadu v\u1ec7 ' + (i + 1) + ' lao v\u00e0o t\u1eeb b\u00ean <b>' + SIDE_VN[ev.side] + '<\/b> sau <b>' + fmtNum(ev.T) + ' gi\u00e2y<\/b>.');\n    el.innerHTML = '<b>Nhi\u1ec7m v\u1ee5 ' + mission.L + ' \u00b7 Qua ng\u01b0\u1eddi.<\/b> ' + parts.join(' ') + ' H\u00e3y n\u00e9 sang b\u00ean ng\u01b0\u1ee3c l\u1ea1i. M\u1ed7i l\u1ea7n N\u00e9 m\u1ea5t 0,5 gi\u00e2y.' + (mission.body ? ' ' + mission.body : '') + ' G\u1ecdn nh\u1ea5t: ' + mission.par + ' kh\u1ed1i.';\n  } else {\n    const K = mission.keeper;\n    const kt = K.mode === 'stay' ? '\u0111\u1ee9ng y\u00ean gi\u1eefa khung th\u00e0nh' : 'bay sang b\u00ean <b>' + SIDE_VN[K.side] + '<\/b>' + (K.h === 'gi\u1eefa' ? '' : ' \u1edf t\u1ea7m <b>' + K.h.toUpperCase() + '<\/b>');\n    el.innerHTML = '<b>Giai \u0111o\u1ea1n s\u00fat.<\/b> Th\u1ee7 m\u00f4n s\u1ebd ' + kt + '. Ch\u1ecdn L\u1ef1c, H\u01b0\u1edbng, \u0110\u1ed9 cao r\u1ed3i k\u1ebft th\u00fac b\u1eb1ng kh\u1ed1i <b>S\u00fat!<\/b>. N\u1ebfu b\u1ea1n kh\u00f4ng ch\u1ecdn, c\u1ea7u th\u1ee7 s\u00fat l\u1ef1c v\u1eeba, h\u01b0\u1edbng gi\u1eefa, t\u1ea7m th\u1ea5p.';\n  }\n}\nfunction enterEdit(stage) {\n  stageKey = stage; phase = 'edit'; setLocked(false); setActive(null);\n  renderPalette(); renderProg(); renderTimeline(); setBrief(); setHead(-1);\n  $('st1').className = 'step ' + (stage === 'dribble' ? 'on' : 'done');\n  $('st2').className = 'step ' + (stage === 'shoot' ? 'on' : '');\n  $('run').textContent = stage === 'dribble' ? 'Ch\u1ea1y: qua ng\u01b0\u1eddi' : 'Ch\u1ea1y: s\u00fat!';\n  if (stage === 'shoot') updateShootPreview(); else { reticle.visible = false; preview.visible = false; }\n  updateHUD();\n}\n$('run').addEventListener('click', () => {\n  sfx.ensure();\n  if (phase !== 'edit') return;\n  if (stageKey === 'dribble') startDribble(); else startShootRun();\n});\n$('mute').addEventListener('click', (e) => {\n  sfx.on = !sfx.on;\n  e.currentTarget.setAttribute('aria-pressed', String(!sfx.on));\n  e.currentTarget.setAttribute('aria-label', sfx.on ? 'T\u1eaft \u00e2m thanh' : 'B\u1eadt \u00e2m thanh');\n  if (sfx.on) sfx.ensure();\n});\n\n/* ================= Camera & v\u00f2ng l\u1eb7p ================= */\nconst camLook = new V3(0, 1, 20), camTarget = new V3(), lookTarget = new V3();\ncamera.position.set(0, 6, 46);\nfunction updateCamera(dt) {\n  if (phase === 'menu' || phase === 'reward') {\n    camTarget.set(Math.sin(time * 0.25) * 10, 4.6, 24 + Math.cos(time * 0.25) * 3); lookTarget.set(0, 1.4, 8);\n  } else if (stageKey === 'dribble' || !shot) {\n    camTarget.set(px3.x * 0.5, 3.4, px3.z + 7.4); lookTarget.set(px3.x * 0.5, 0.9, px3.z - 10);\n  } else {\n    const b = shot.b0;\n    camTarget.set(b.x * 0.3, 3.7, b.z + 8.8); lookTarget.set(b.x * 0.3, 0.5, b.z - 13);\n    if (shot.launched) lookTarget.lerp(ball.pos, 0.2);\n  }\n  const k = 1 - Math.exp(-dt * 3.2);\n  camera.position.lerp(camTarget, k); camLook.lerp(lookTarget, k);\n  trauma = Math.max(0, trauma - dt * 1.4);\n  const sh = trauma * trauma * 0.35;\n  camera.lookAt(camLook.x + (rnd() - 0.5) * sh, camLook.y + (rnd() - 0.5) * sh, camLook.z);\n}\nfunction update(dt) {\n  time += dt;\n  if (phase === 'dribbleRun') updateDribble(dt);\n  else if (phase === 'dribbleFail') { timer -= dt; if (timer <= 0) { resetDribbleScene(); enterEdit('dribble'); } }\n  else if (phase === 'shootRun') {\n    run.t += dt; updateKeeper(dt);\n    const i = Math.floor(run.t / 0.45);\n    if (i !== run.i) { run.i = i; if (i < run.o.steps.length) setActive(run.o.steps[i]); else fire(run.o); }\n  } else if (phase === 'kick') {\n    kickT += dt; poseKicker(kickT); updateKeeper(dt);\n    if (kickT >= KICK_CONTACT) launch();\n  } else if (phase === 'fly' || phase === 'result') {\n    kickT += dt; poseKicker(kickT);\n    acc += Math.min(dt, 0.05);\n    while (acc >= 1 / 120) { acc -= 1 / 120; flyStep(1 / 120); }\n    if (phase === 'result') { timer -= dt; if (timer <= 0) { if (shot.won) { const r = giveReward(); showReward(r); } else resetShoot(); } }\n    if (ball.vel.lengthSq() > 0.01) {\n      const axis = new V3(0, -1, 0).cross(ball.vel);\n      if (axis.lengthSq() > 1e-6) { axis.normalize(); ballMesh.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, ball.vel.length() * dt / BR)); }\n    }\n    ballMesh.position.copy(ball.pos);\n  } else { updateKeeper(dt); }\n  if (phase === 'edit' || phase === 'shootRun') { const s = 1 + 0.08 * Math.sin(time * 6); reticle.scale.set(s, s, 1); }\n  crowd.cheer *= Math.exp(-dt * 0.5);\n  if ((crowd.frame++ & 1) === 0) updateCrowd(time);\n  updateConfetti(dt);\n  clouds.forEach((c) => { c.position.x += dt * 0.8; if (c.position.x > 120) c.position.x = -120; });\n  updateCamera(dt);\n}\nlet last = performance.now();\nfunction loop(now) {\n  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));\n  last = now;\n  update(dt);\n  renderer.render(scene, camera);\n  requestAnimationFrame(loop);\n}\n\n/* ================= Kh\u1edfi \u0111\u1ed9ng ================= */\nbuildPitch(); buildGoal(); buildBoards(); buildStands(); buildClouds(); buildKicker();\nmission = makeMission(save.level);\nresetDribbleScene();\nreticle.visible = false; preview.visible = false;\nenterEdit('dribble'); showMenu();\ncamera.position.set(0, 4.6, 24);\nrequestAnimationFrame(loop);\n})();\n\n<\/script>\n\n<script>(()=>{const e=document.getElementById('coinsV');if(!e)return;let l=parseInt(e.textContent)||0;new MutationObserver(()=>{const v=parseInt(e.textContent)||0;if(v>l)parent.postMessage({t:'coins',d:v-l},'*');l=v}).observe(e,{childList:true,characterData:true,subtree:true})})();<\/script><\/body><\/html>";</script>
